name: Build and Test Stack

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  CONTRACTS_REPO: 'kaansari/contracts-repo'
  SERVICES_REPO: 'kaansari/services-repo'
  APPS_REPO: 'kaansari/apps-repo'
  GO_VERSION: '1.26.2'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra
        uses: actions/checkout@v4

      - name: Checkout contracts repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONTRACTS_REPO }}
          path: contracts-repo
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Checkout services repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SERVICES_REPO }}
          path: services-repo
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Checkout apps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APPS_REPO }}
          path: apps-repo
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            contracts-repo/packages/ceerat-contracts/go.sum
            services-repo/services/ceerat-user-service/go.sum
            apps-repo/ai/ceerat-agent-service/go.sum
            apps-repo/apps/ceerat-admin-ui/go.sum
            apps-repo/apps/ceerat-customer-ui/go.sum
            apps-repo/apps/ceerat-web-ui/go.sum

      - name: Create CI workspace
        run: |
          cat > go.work <<'EOF'
          go ${{ env.GO_VERSION }}

          use (
            ./apps-repo/ai/ceerat-agent-service
            ./apps-repo/apps/ceerat-admin-ui
            ./apps-repo/apps/ceerat-customer-ui
            ./apps-repo/apps/ceerat-web-ui
            ./contracts-repo/packages/ceerat-contracts
            ./services-repo/services/ceerat-user-service
          )

          replace github.com/kaansari/ceerat-platform/packages/ceerat-contracts => ./contracts-repo/packages/ceerat-contracts
          EOF

          mkdir -p bin

      - name: Build contracts
        working-directory: ./contracts-repo/packages/ceerat-contracts
        run: |
          go test ./...
          go build ./...

      - name: Build user service
        working-directory: ./services-repo/services/ceerat-user-service
        run: |
          go test ./...
          go build -buildvcs=false -o ../../../bin/ceerat-user-service .

      - name: Build apps and agent
        run: |
          (cd apps-repo/ai/ceerat-agent-service && go test ./... && go build -buildvcs=false -o ../../../bin/ceerat-agent-service .)
          (cd apps-repo/apps/ceerat-web-ui && go test ./... && go build -buildvcs=false -o ../../../bin/ceerat-web-ui .)
          (cd apps-repo/apps/ceerat-admin-ui && go test ./... && go build -buildvcs=false -o ../../../bin/ceerat-admin-ui .)
          (cd apps-repo/apps/ceerat-customer-ui && go test ./... && go build -buildvcs=false -o ../../../bin/ceerat-customer-ui .)

      - name: Upload built binaries
        uses: actions/upload-artifact@v4
        with:
          name: infra-binaries
          path: bin/**
