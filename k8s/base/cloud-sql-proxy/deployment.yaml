apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-sql-proxy
  namespace: ceerat-data
  labels:
    app.kubernetes.io/name: cloud-sql-proxy
    app.kubernetes.io/part-of: ceerat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-sql-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-sql-proxy
        app.kubernetes.io/part-of: ceerat
    spec:
      serviceAccountName: cloud-sql-proxy
      containers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4
          args:
            - --structured-logs
            - --address=0.0.0.0
            - --port=5432
            - $(INSTANCE_CONNECTION_NAME)
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                secretKeyRef:
                  name: cloud-sql-instance
                  key: INSTANCE_CONNECTION_NAME
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
