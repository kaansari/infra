apiVersion: apps/v1
kind: Deployment
metadata:
  name: ceerat-keycloak
  namespace: ceerat-backend
  labels:
    app.kubernetes.io/name: ceerat-keycloak
    app.kubernetes.io/part-of: ceerat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ceerat-keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ceerat-keycloak
        app.kubernetes.io/part-of: ceerat
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4.0
          imagePullPolicy: IfNotPresent
          args:
            - start-dev
            - --health-enabled=true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ceerat-keycloak-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ceerat-keycloak-admin
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
