apiVersion: v1
kind: ConfigMap
metadata:
  name: ceerat-platform-config
  namespace: ceerat-backend
data:
  CEERAT_ENV: production
  CEERAT_API_BASE_URL: ceerat-user-service.ceerat-backend.svc.cluster.local:50051
  CEERAT_AGENT_BASE_URL: http://ceerat-agent-service.ceerat-backend.svc.cluster.local:8088
  CEERAT_ADMIN_API_BASE_URL: http://ceerat-user-service.ceerat-backend.svc.cluster.local:8081
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ceerat-platform-config
  namespace: ceerat-frontend
data:
  CEERAT_ENV: production
  CEERAT_API_BASE_URL: ceerat-user-service.ceerat-backend.svc.cluster.local:50051
  CEERAT_AGENT_BASE_URL: http://ceerat-agent-service.ceerat-backend.svc.cluster.local:8088
  CEERAT_ADMIN_API_BASE_URL: http://ceerat-user-service.ceerat-backend.svc.cluster.local:8081
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ceerat-db-config
  namespace: ceerat-backend
data:
  DB_HOST: postgres.ceerat-data.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: ceerat
  DB_USER: ceerat
---
apiVersion: v1
kind: Secret
metadata:
  name: ceerat-db-credentials
  namespace: ceerat-backend
type: Opaque
stringData:
  DB_PASSWORD: replace-me
---
apiVersion: v1
kind: Secret
metadata:
  name: ceerat-openai
  namespace: ceerat-backend
type: Opaque
stringData:
  OPENAI_API_KEY: replace-me
  OPENAI_MODEL: gpt-4.1-mini
