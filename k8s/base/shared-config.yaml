apiVersion: v1
kind: ConfigMap
metadata:
  name: ceerat-platform-config
  namespace: ceerat-backend
data:
  CEERAT_ENV: local
  CEERAT_API_BASE_URL: ceerat-user-service.ceerat-backend.svc.cluster.local:50051
  CEERAT_USER_GRPC_TARGET: ceerat-user-service.ceerat-backend.svc.cluster.local:50051
  CEERAT_AGENT_BASE_URL: http://ceerat-agent-service.ceerat-backend.svc.cluster.local:8088
  CEERAT_OAUTH_ISSUER: http://ceerat-keycloak.ceerat-backend.svc.cluster.local:8080/realms/ceerat
  CEERAT_MCP_RESOURCE: http://ceerat-agent-gateway.ceerat-backend.svc.cluster.local:8090/mcp
  CEERAT_OAUTH_AUDIENCE: http://ceerat-agent-gateway.ceerat-backend.svc.cluster.local:8090/mcp
  CEERAT_WEB_OAUTH_CLIENT_ID: ceerat-web-ui
  CEERAT_ADMIN_OAUTH_CLIENT_ID: ceerat-admin-ui
  CEERAT_CUSTOMER_OAUTH_CLIENT_ID: ceerat-customer-ui
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ceerat-platform-config
  namespace: ceerat-frontend
data:
  CEERAT_ENV: local
  CEERAT_API_BASE_URL: ceerat-user-service.ceerat-backend.svc.cluster.local:50051
  CEERAT_USER_GRPC_TARGET: ceerat-user-service.ceerat-backend.svc.cluster.local:50051
  CEERAT_AGENT_BASE_URL: http://ceerat-agent-service.ceerat-backend.svc.cluster.local:8088
  CEERAT_OAUTH_ISSUER: http://ceerat-keycloak.ceerat-backend.svc.cluster.local:8080/realms/ceerat
  CEERAT_MCP_RESOURCE: http://ceerat-agent-gateway.ceerat-backend.svc.cluster.local:8090/mcp
  CEERAT_OAUTH_AUDIENCE: http://ceerat-agent-gateway.ceerat-backend.svc.cluster.local:8090/mcp
  CEERAT_WEB_OAUTH_CLIENT_ID: ceerat-web-ui
  CEERAT_ADMIN_OAUTH_CLIENT_ID: ceerat-admin-ui
  CEERAT_CUSTOMER_OAUTH_CLIENT_ID: ceerat-customer-ui
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ceerat-db-config
  namespace: ceerat-backend
data:
  DB_HOST: postgres.ceerat-data.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: ceerat
  DB_USER: ceerat
---
apiVersion: v1
kind: Secret
metadata:
  name: ceerat-db-credentials
  namespace: ceerat-backend
type: Opaque
stringData:
  DB_PASSWORD: replace-me
---
apiVersion: v1
kind: Secret
metadata:
  name: ceerat-openai
  namespace: ceerat-backend
type: Opaque
stringData:
  OPENAI_API_KEY: replace-me
  OPENAI_MODEL: gpt-4.1-mini
