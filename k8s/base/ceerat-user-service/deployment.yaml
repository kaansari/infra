apiVersion: apps/v1
kind: Deployment
metadata:
  name: ceerat-user-service
  namespace: ceerat-backend
  labels:
    app.kubernetes.io/name: ceerat-user-service
    app.kubernetes.io/part-of: ceerat
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ceerat-user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ceerat-user-service
        app.kubernetes.io/part-of: ceerat
    spec:
      containers:
        - name: ceerat-user-service
          image: ceerat-user-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
            - name: admin-http
              containerPort: 8081
          env:
            - name: PORT
              value: "50051"
            - name: CEERAT_USER_ADMIN_PORT
              value: "8081"
            - name: CEERAT_ENV
              valueFrom:
                configMapKeyRef:
                  name: ceerat-platform-config
                  key: CEERAT_ENV
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ceerat-db-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: ceerat-db-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: ceerat-db-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: ceerat-db-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ceerat-db-credentials
                  key: DB_PASSWORD
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
