apiVersion: apps/v1
kind: Deployment
metadata:
  name: ceerat-web-ui
  namespace: ceerat-frontend
  labels:
    app.kubernetes.io/name: ceerat-web-ui
    app.kubernetes.io/part-of: ceerat
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ceerat-web-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ceerat-web-ui
        app.kubernetes.io/part-of: ceerat
    spec:
      containers:
        - name: ceerat-web-ui
          image: ceerat-apps-repo
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/ceerat-web-ui
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: CEERAT_WEB_UI_PORT
              value: "3000"
            - name: CEERAT_WEB_UI_ROOT
              value: /app/ceerat-web-ui
            - name: CEERAT_ENV
              valueFrom:
                configMapKeyRef:
                  name: ceerat-platform-config
                  key: CEERAT_ENV
            - name: CEERAT_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ceerat-platform-config
                  key: CEERAT_API_BASE_URL
            - name: CEERAT_AGENT_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ceerat-platform-config
                  key: CEERAT_AGENT_BASE_URL
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
