apiVersion: apps/v1
kind: Deployment
metadata:
  name: ceerat-agent-service
  namespace: ceerat-backend
  labels:
    app.kubernetes.io/name: ceerat-agent-service
    app.kubernetes.io/part-of: ceerat
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ceerat-agent-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ceerat-agent-service
        app.kubernetes.io/part-of: ceerat
    spec:
      containers:
        - name: ceerat-agent-service
          image: ceerat-apps-repo
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/ceerat-agent-service
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: PORT
              value: "8088"
            - name: CEERAT_ENV
              valueFrom:
                configMapKeyRef:
                  name: ceerat-platform-config
                  key: CEERAT_ENV
            - name: CEERAT_USER_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: ceerat-platform-config
                  key: CEERAT_API_BASE_URL
            - name: CEERAT_USER_SERVICE_TLS_MODE
              value: insecure
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ceerat-openai
                  key: OPENAI_API_KEY
            - name: OPENAI_MODEL
              valueFrom:
                secretKeyRef:
                  name: ceerat-openai
                  key: OPENAI_MODEL
            - name: CEERAT_OAUTH_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: ceerat-platform-config
                  key: CEERAT_OAUTH_ISSUER
            - name: CEERAT_OAUTH_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: ceerat-platform-config
                  key: CEERAT_OAUTH_AUDIENCE
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
