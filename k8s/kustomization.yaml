apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - base/namespaces.yaml
  - base/shared-config.yaml
  - base/ceerat-user-service/deployment.yaml
  - base/ceerat-user-service/service.yaml
  - base/ceerat-user-service/network-policy.yaml
  - base/ceerat-agent-service/deployment.yaml
  - base/ceerat-agent-service/service.yaml
  - base/frontend-apps/deployments.yaml
  - base/frontend-apps/services.yaml
  - base/ingress/ingress.yaml
  - base/postgres/secret.yaml
  - base/postgres/statefulset.yaml
  - base/postgres/service.yaml
  - base/typesense/secret.yaml
  - base/typesense/statefulset.yaml
  - base/typesense/service.yaml
images:
  - name: ceerat-services-repo
    newName: us-docker.pkg.dev/PROJECT_ID/ceerat/ceerat-services-repo
    newTag: latest
  - name: ceerat-apps-repo
    newName: us-docker.pkg.dev/PROJECT_ID/ceerat/ceerat-apps-repo
    newTag: latest
