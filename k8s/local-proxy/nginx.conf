pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/null;
events { worker_connections 512; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 55m;
    client_body_timeout 60s;
    keepalive_timeout 65s;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 8443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    ssl_certificate /etc/ceerat/tls/tls.crt;
    ssl_certificate_key /etc/ceerat/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server {
        listen 8080;
        location = /healthz { return 200 'ok'; }
        location / { return 404; }
    }
    server {
        listen 8443 ssl default_server;
        server_name _;
        return 421;
    }
    server {
        listen 8443 ssl;
        server_name customer.localhost;
        location / { proxy_pass http://ceerat-customer-ui.ceerat-frontend.svc.cluster.local:3005; }
    }
    server {
        listen 8443 ssl;
        server_name app.localhost;
        location / { proxy_pass http://ceerat-web-ui.ceerat-frontend.svc.cluster.local:3000; }
    }
    server {
        listen 8443 ssl;
        server_name admin.localhost;
        location / { proxy_pass http://ceerat-admin-ui.ceerat-frontend.svc.cluster.local:3010; }
    }
    server {
        listen 8443 ssl;
        server_name localhost auth.localhost;
        # Realm/OIDC resources only; Keycloak administration/management stay private.
        location /realms/ {
            proxy_pass https://ceerat-keycloak.ceerat-backend.svc.cluster.local:8443;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_server_name on;
            proxy_ssl_name ceerat-keycloak.ceerat-backend.svc.cluster.local;
            proxy_ssl_trusted_certificate /etc/ceerat/ca/ca.crt;
        }
        location /resources/ {
            proxy_pass https://ceerat-keycloak.ceerat-backend.svc.cluster.local:8443;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_server_name on;
            proxy_ssl_name ceerat-keycloak.ceerat-backend.svc.cluster.local;
            proxy_ssl_trusted_certificate /etc/ceerat/ca/ca.crt;
        }
        location = / { return 302 /realms/ceerat/account/; }
        location / { return 404; }
    }
}
