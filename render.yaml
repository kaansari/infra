services:
  - type: web
    name: ceerat-keycloak
    plan: free
    runtime: docker
    repo: https://github.com/kaansari/infra
    branch: main
    dockerfilePath: ./deploy/render/keycloak/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /realms/ceerat
    envVars:
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL_HOST
        fromDatabase:
          name: ceerat-postgres
          property: host
      - key: KC_DB_URL_PORT
        fromDatabase:
          name: ceerat-postgres
          property: port
      - key: KC_DB_URL_DATABASE
        fromDatabase:
          name: ceerat-postgres
          property: database
      - key: KC_DB_USERNAME
        fromDatabase:
          name: ceerat-postgres
          property: user
      - key: KC_DB_PASSWORD
        fromDatabase:
          name: ceerat-postgres
          property: password
      - key: KC_DB_SCHEMA
        value: public
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: KC_HOSTNAME
        value: https://ceerat-keycloak.onrender.com
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_HTTP_PORT
        value: "10000"
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_HEALTH_ENABLED
        value: "true"
      - key: JAVA_OPTS_KC_HEAP
        value: -XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=65
      - key: CEERAT_GOOGLE_CLIENT_ID
        sync: false
      - key: CEERAT_GOOGLE_CLIENT_SECRET
        sync: false
      - key: CEERAT_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: CEERAT_SMTP_PORT
        value: "2525"
      - key: CEERAT_SMTP_FROM
        value: khalid.a.ansari@gmail.com
      - key: CEERAT_SMTP_USER
        value: b77316001@smtp-brevo.com
      - key: CEERAT_SMTP_PASSWORD
        sync: false
      - key: CEERAT_KEYCLOAK_REVOKER_CLIENT_SECRET
        sync: false

  - type: pserv
    name: ceerat-user-service
    plan: 0.5c-512mb
    runtime: go
    repo: https://github.com/kaansari/services-repo
    branch: main
    rootDir: services/ceerat-user-service
    buildCommand: go build -mod=vendor -trimpath -o bin/ceerat-user-service .
    startCommand: ./bin/ceerat-user-service
    autoDeployTrigger: commit
    envVars:
      - key: CEERAT_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_AUTH_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CEERAT_GATEWAY_WORKLOAD_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: ceerat-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ceerat-postgres
          property: port
      - key: DB_USER
        fromDatabase:
          name: ceerat-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ceerat-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: ceerat-postgres
          property: database
      - key: DB_SSLMODE
        value: require

  - type: web
    name: ceerat-agent-gateway
    plan: free
    runtime: go
    repo: https://github.com/kaansari/apps-repo
    branch: main
    rootDir: ai/ceerat-agent-gateway
    buildCommand: go build -mod=vendor -trimpath -o bin/ceerat-agent-gateway .
    startCommand: ./bin/ceerat-agent-gateway
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: CEERAT_ENV
        value: production
      - key: CEERAT_USER_SERVICE_ADDR
        value: ceerat-user-service:10000
      - key: CEERAT_MCP_RESOURCE
        value: https://ceerat-agent-gateway.onrender.com/mcp
      - key: CEERAT_OAUTH_ISSUER
        value: https://ceerat-keycloak.onrender.com/realms/ceerat
      - key: CEERAT_OAUTH_JWKS_URL
        value: https://ceerat-keycloak.onrender.com/realms/ceerat/protocol/openid-connect/certs
      - key: CEERAT_USER_ID_CLAIM
        value: ceerat_user_id
      - key: CEERAT_CLIENT_ID_CLAIM
        value: azp
      - key: CEERAT_GATEWAY_WORKLOAD_SECRET
        fromService:
          type: pserv
          name: ceerat-user-service
          envVarKey: CEERAT_GATEWAY_WORKLOAD_SECRET
      - key: CEERAT_GATEWAY_DATABASE_URL
        fromDatabase:
          name: ceerat-postgres
          property: connectionString

databases:
  - name: ceerat-postgres
    plan: free
    databaseName: ceerat
    user: ceerat
