services:
  ceerat-keycloak:
    image: ${CEERAT_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.3}
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${CEERAT_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${CEERAT_KEYCLOAK_ADMIN_PASSWORD:?set CEERAT_KEYCLOAK_ADMIN_PASSWORD for local development}
    ports:
      - "127.0.0.1:${CEERAT_KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./dev/keycloak/ceerat-realm.json:/opt/keycloak/data/import/ceerat-realm.json:ro
    restart: "no"
